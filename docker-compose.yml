version: '3.8'

services:
  osrm-backend:
    image: osrm/osrm-backend
    container_name: osrm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/france-latest.osrm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  streamlit-app:
    build: .
    container_name: sectorisation-app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    working_dir: /app
    command: streamlit run home.py --server.address 0.0.0.0
    depends_on:
      - osrm-backend
    environment:
      - OSRM_URL=http://osrm-backend:5000
    restart: unless-stopped
